name: Build InfoJano Tool APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-tool-apks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install icon generator
        run: python -m pip install --user pillow

      - name: Build one APK for each remaining tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist app/src/main/res/drawable-nodpi
          while IFS='|' read -r tool_id tool_name page icon_text; do
            [ -z "$tool_id" ] && continue
            echo "::group::Building $tool_name"
            python - "$tool_name" "$icon_text" <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import hashlib, sys
          name, letters = sys.argv[1], sys.argv[2]
          digest = hashlib.sha256(name.encode()).digest()
          palette = [(37,99,235),(2,132,199),(13,148,136),(124,58,237),(217,119,6),(219,39,119),(22,163,74),(79,70,229)]
          bg = palette[digest[0] % len(palette)]
          im = Image.new("RGBA", (512,512), (0,0,0,0))
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((18,18,494,494), radius=112, fill=bg)
          d.ellipse((90,90,422,422), fill=(255,255,255,245))
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 112 if len(letters)<=3 else 88)
          except OSError:
              font = ImageFont.load_default()
          box = d.textbbox((0,0), letters, font=font)
          x=(512-(box[2]-box[0]))/2-box[0]
          y=(512-(box[3]-box[1]))/2-box[1]-8
          d.text((x,y), letters, font=font, fill=bg)
          im.save("app/src/main/res/drawable-nodpi/tool_icon.png")
          PY
            gradle --no-daemon assembleDebug \
              -PtoolId="$tool_id" \
              -PtoolName="$tool_name" \
              -PtoolUrl="https://barsulkhan.github.io/InfoJano/$page"
            filename="InfoJano-${tool_name// /-}.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "dist/$filename"
            echo "Built $filename"
            echo "::endgroup::"
          done <<'TOOLS'
          bmi|BMI Calculator|bmi.html|BMI
          currencyconverter|Currency Converter|currency-converter.html|FX
          datedifference|Date Difference Calculator|date-difference.html|DATE
          discount|Discount Calculator|discount.html|DISC
          emi|EMI Calculator|emi.html|EMI
          gstcalculator|GST Calculator|gst-calculator.html|GST
          imagecompressor|Image Compressor|image-compressor.html|IMG
          imageresizer|Image Resizer|image-resizer.html|SIZE
          imagetopdf|Image to PDF|image-to-pdf.html|PDF
          loaneligibility|Loan Eligibility Calculator|loan-eligibility.html|LOAN
          loaninterest|Loan Interest Calculator|loan-interest.html|INT
          numbertowords|Number to Words|number-to-words.html|123
          passwordgenerator|Password Generator|password-generator.html|PASS
          percentage|Percentage Calculator|percentage.html|PCT
          percentagechange|Percentage Change Calculator|percentage-change.html|CHG
          qrmaker|QR Code Maker|qr-maker.html|QR
          savings|Savings Calculator|savings.html|SAVE
          textcounter|Text Counter|text-counter.html|TXT
          timecalculator|Time Calculator|time-calculator.html|TIME
          tipcalculator|Tip Calculator|tip-calculator.html|TIP
          unitconverter|Unit Converter|unit-converter.html|UNIT
          TOOLS

      - name: Upload APK files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfoJano-Tool-APKs
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tool APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: infojano-tool-apps-v1.0.0
          name: InfoJano Tool Apps v1.0.0
          body: |
            Separate Android APKs for individual InfoJano tools.
            Each app opens its matching tool page directly.
            These are debug-signed test builds and require internet access.
          draft: false
          prerelease: true
          files: android/dist/*.apk
