name: Build InfoJano Tool APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app-icons/**'
      - '.github/workflows/build-tool-apks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install icon tools
        run: python -m pip install --user pillow cairosvg

      - name: Validate tool icons, manifests, and APK matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('.')
          icons = sorted((root / 'app-icons').glob('*.svg'))
          manifests = sorted((root / 'app-manifests').glob('*.webmanifest'))
          pages = sorted(p for p in root.glob('*.html') if p.name not in {'index.html', 'google4a4795e5c7c03eae.html'})
          assert len(icons) == 23, f'Expected 23 SVG icons, found {len(icons)}'
          assert len(manifests) == 22, f'Expected 22 manifests, found {len(manifests)}'
          assert len(pages) == 23, f'Expected 23 tool pages, found {len(pages)}'
          for icon in icons:
              ET.parse(icon)
          for manifest in manifests:
              data = json.loads(manifest.read_text(encoding='utf-8'))
              slug = manifest.stem
              page = root / f'{slug}.html'
              assert page.exists(), f'Missing tool page: {page}'
              assert data.get('start_url') == f'/InfoJano/{slug}.html', f'Wrong start_url: {manifest}'
              assert data.get('scope') == '/InfoJano/', f'Wrong scope: {manifest}'
              expected = f'/InfoJano/app-icons/{slug}.svg'
              assert any(item.get('src') == expected for item in data.get('icons', [])), f'Wrong icon: {manifest}'
              html = page.read_text(encoding='utf-8')
              assert f'app-manifests/{slug}.webmanifest' in html, f'Missing manifest link: {page}'
              assert 'install.js' in html, f'Missing installer script: {page}'
          sw = (root / 'sw.js').read_text(encoding='utf-8')
          for icon in icons:
              assert f'/InfoJano/{icon.as_posix()}' in sw, f'Icon missing from service-worker cache: {icon}'
          for page in pages:
              assert f'/InfoJano/{page.name}' in sw, f'Tool page missing from service-worker cache: {page}'
          for manifest in manifests:
              assert f'/InfoJano/{manifest.as_posix()}' in sw, f'Manifest missing from service-worker cache: {manifest}'
          workflow = (root / '.github/workflows/build-tool-apks.yml').read_text(encoding='utf-8')
          section = workflow.split("done <<'TOOLS'", 1)[1].split('\nTOOLS', 1)[0]
          entries = [line.strip() for line in section.splitlines() if line.strip() and '|' in line]
          assert len(entries) == 23, f'Expected 23 APK targets, found {len(entries)}'
          assert len({line.split('|')[0] for line in entries}) == 23, 'Duplicate APK IDs'
          assert {line.split('|')[2] for line in entries} == {page.name for page in pages}, 'APK targets do not match tool pages'
          print('Validation passed: 23 SVGs, 22 manifests, 23 pages and 23 APK targets.')
          PY

      - name: Build one APK for each remaining tool
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist app/src/main/res/drawable-nodpi
          while IFS='|' read -r tool_id tool_name page icon_text icon_file; do
            [ -z "$tool_id" ] && continue
            echo "::group::Building $tool_name"
            python - "$tool_name" "$icon_text" "$icon_file" <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import cairosvg, hashlib, os, sys
          name, letters, icon_file = sys.argv[1], sys.argv[2], sys.argv[3]
          target = "app/src/main/res/drawable-nodpi/tool_icon.png"
          svg_path = os.path.join("..", "app-icons", icon_file) if icon_file else ""
          if svg_path and os.path.isfile(svg_path):
              cairosvg.svg2png(url=svg_path, write_to=target, output_width=512, output_height=512)
          else:
              digest = hashlib.sha256(name.encode()).digest()
              palette = [(37,99,235),(2,132,199),(13,148,136),(124,58,237),(217,119,6),(219,39,119),(22,163,74),(79,70,229)]
              bg = palette[digest[0] % len(palette)]
              im = Image.new("RGBA", (512,512), (0,0,0,0))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle((18,18,494,494), radius=112, fill=bg)
              d.ellipse((90,90,422,422), fill=(255,255,255,245))
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 112 if len(letters)<=3 else 88)
              except OSError:
                  font = ImageFont.load_default()
              box = d.textbbox((0,0), letters, font=font)
              x=(512-(box[2]-box[0]))/2-box[0]
              y=(512-(box[3]-box[1]))/2-box[1]-8
              d.text((x,y), letters, font=font, fill=bg)
              im.save(target)
          PY
            gradle --no-daemon assembleDebug \
              -PtoolId="$tool_id" \
              -PtoolName="$tool_name" \
              -PtoolUrl="https://barsulkhan.github.io/InfoJano/$page?app=1"
            filename="InfoJano-${tool_name// /-}.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "dist/$filename"
            echo "Built $filename"
            echo "::endgroup::"
          done <<'TOOLS'
          agecalculator|Age Calculator|age.html|AGE|age.svg
          bmi|BMI Calculator|bmi.html|BMI|bmi.svg
          currencyconverter|Currency Converter|currency-converter.html|FX|currency-converter.svg
          datedifference|Date Difference Calculator|date-difference.html|DATE|date-difference.svg
          discount|Discount Calculator|discount.html|DISC|discount.svg
          emi|EMI Calculator|emi.html|EMI|emi.svg
          gstcalculator|GST Calculator|gst-calculator.html|GST|gst-calculator.svg
          imagecompressor|Image Compressor|image-compressor.html|IMG|image-compressor.svg
          imageresizer|Image Resizer|image-resizer.html|SIZE|image-resizer.svg
          imagetopdf|Image to PDF|image-to-pdf.html|PDF|image-to-pdf.svg
          loaneligibility|Loan Eligibility Calculator|loan-eligibility.html|LOAN|loan-eligibility.svg
          loaninterest|Loan Interest Calculator|loan-interest.html|INT|loan-interest.svg
          numbertowords|Number to Words|number-to-words.html|123|number-to-words.svg
          passwordgenerator|Password Generator|password-generator.html|PASS|password-generator.svg
          percentage|Percentage Calculator|percentage.html|PCT|percentage.svg
          percentagechange|Percentage Change Calculator|percentage-change.html|CHG|percentage-change.svg
          qrmaker|QR Code Maker|qr-maker.html|QR|qr-maker.svg
          savings|Savings Calculator|savings.html|SAVE|savings.svg
          textcounter|Text Counter|text-counter.html|TXT|text-counter.svg
          timecalculator|Time Calculator|time-calculator.html|TIME|time-calculator.svg
          tipcalculator|Tip Calculator|tip-calculator.html|TIP|tip-calculator.svg
          unitconverter|Unit Converter|unit-converter.html|UNIT|unit-converter.svg
          idcardprintstudio|ID Card Print Studio|id-card-print-studio.html|ID|id-card-print-studio.svg
          TOOLS

      - name: Verify APK package count
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          count=$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)
          test "$count" -eq 23 || { echo "Expected 23 APKs, found $count"; exit 1; }
          test -f dist/InfoJano-Age-Calculator.apk
          test -f dist/InfoJano-ID-Card-Print-Studio.apk
          echo "Verified $count APK files."

      - name: Upload APK files as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfoJano-Tool-APKs
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tool APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: infojano-tool-apps-v1.1.1
          name: InfoJano Tool Apps v1.1.1
          body: |
            InfoJano individual tool apps v1.1.1.
            Each app uses its matching dedicated InfoJano icon and opens its matching tool page directly.
            These debug-signed builds require internet access.
          draft: false
          prerelease: true
          overwrite_files: true
          files: android/dist/*.apk
