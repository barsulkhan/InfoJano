name: Build InfoJano Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/build-desktop-app.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-app/package.json
      - name: Install dependencies
        working-directory: desktop-app
        run: npm install
      - name: Build Windows installer and portable app
        working-directory: desktop-app
        run: npm run dist
      - name: Verify Windows packages
        shell: pwsh
        run: |
          $installer = "desktop-app/dist/InfoJano-Setup-1.0.0.exe"
          $portable = "desktop-app/dist/InfoJano-Portable-1.0.0.exe"
          if (!(Test-Path $installer)) { throw "Missing Windows installer: $installer" }
          if (!(Test-Path $portable)) { throw "Missing portable Windows app: $portable" }
          if ((Get-Item $installer).Length -lt 1000000) { throw "Installer file looks unexpectedly small." }
          if ((Get-Item $portable).Length -lt 1000000) { throw "Portable app looks unexpectedly small." }
          Get-Item $installer, $portable | Select-Object Name, Length
      - name: Publish Windows downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "infojano-desktop-apps-v1.0.0"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "desktop-app/dist/InfoJano-Setup-1.0.0.exe" "desktop-app/dist/InfoJano-Portable-1.0.0.exe" --repo "${{ github.repository }}" --title "InfoJano Windows Desktop App v1.0.0" --notes "Initial Windows desktop release. Includes an installable Windows setup EXE and a portable EXE. The app loads the current InfoJano website and requires an internet connection."
          } else {
            gh release upload $tag "desktop-app/dist/InfoJano-Setup-1.0.0.exe" "desktop-app/dist/InfoJano-Portable-1.0.0.exe" --repo "${{ github.repository }}" --clobber
          }
