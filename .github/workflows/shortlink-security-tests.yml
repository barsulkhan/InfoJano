name: Short Link Security Tests

on:
  push:
    branches:
      - security/shortlink-url-validation-tests
    paths:
      - "backend/shortlinks/**"
      - ".github/workflows/shortlink-security-tests.yml"
  pull_request:
    paths:
      - "backend/shortlinks/**"
      - ".github/workflows/shortlink-security-tests.yml"

jobs:
  url-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/shortlinks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
