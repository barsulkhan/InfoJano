name: Privacy Policy QA

on:
  pull_request:
    paths:
      - "privacy-policy.html"
      - "contact.html"
      - "index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/validate-privacy-policy-links.mjs"
      - ".github/workflows/privacy-policy-qa.yml"
  push:
    branches:
      - main
      - feature/privacy-policy-adsense-compliance
    paths:
      - "privacy-policy.html"
      - "contact.html"
      - "index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/validate-privacy-policy-links.mjs"
      - ".github/workflows/privacy-policy-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Privacy Policy HTML5 markup
        run: npx --yes html-validate@latest privacy-policy.html
      - name: Check policy links, sitemap and robots reference
        run: node scripts/validate-privacy-policy-links.mjs
