name: Password Generator Browser QA

on:
  push:
    branches: [main]
    paths:
      - 'password-generator.html'
      - 'qa/browser/**'
      - '.github/workflows/password-generator-browser-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'password-generator.html'
      - 'qa/browser/**'
      - '.github/workflows/password-generator-browser-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  password-generator-browser:
    name: Password Generator — Chromium desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa/browser
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python static server
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Password Generator browser tests
        run: npm test -- --grep 'Password Generator'
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-generator-playwright-report
          path: |
            qa/browser/playwright-report/
            qa/browser/test-results/
          if-no-files-found: ignore
          retention-days: 14
