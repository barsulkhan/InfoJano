name: Tool Regression Browser Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'qr-maker.html'
      - 'upi-payment-qr-code-generator.html'
      - 'image-resizer.html'
      - 'percentage.html'
      - 'discount.html'
      - 'qa/tool-regression/**'
      - '.github/workflows/tool-regression-browser-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-regression-browser:
    name: Tool regression — Chromium desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: qa/tool-regression
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python static server
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tool regression browser tests
        run: npm test
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-regression-playwright-report
          path: |
            qa/tool-regression/playwright-report/
            qa/tool-regression/test-results/
          if-no-files-found: ignore
          retention-days: 14
