<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Social Media QR Code Maker | InfoJano</title>
<meta name="description" content="Create a QR code for Instagram, Facebook, YouTube, TikTok, Telegram, WhatsApp or multiple social profile links.">
<link rel="canonical" href="https://barsulkhan.github.io/InfoJano/social-qr-maker.html">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f6ff;color:#172033;line-height:1.6}header{background:#10458e;color:#fff;text-align:center;padding:22px 15px}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#dbeafe;font-size:14px}.wrap{max-width:680px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #dce5f2;border-radius:18px;padding:20px;box-shadow:0 5px 20px #1720330c}h2{font-size:21px;margin:0 0 12px}label{display:block;font-weight:700;font-size:14px;margin:13px 0 6px}input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:16px}button{width:100%;border:0;border-radius:11px;background:#173f7a;color:#fff;font-weight:750;font-size:16px;padding:14px;margin-top:16px;cursor:pointer}button:disabled{opacity:.6}.note{font-size:12px;color:#64748b;margin:7px 0}.status{min-height:22px;color:#334155;font-size:13px;margin-top:10px}#qr{text-align:center;margin-top:20px}#qr img{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;border-radius:18px;box-shadow:0 8px 26px #17203318}.qr-download{display:inline-block;margin-top:14px;padding:12px 18px;background:#0b7a55;color:#fff;border-radius:10px;text-decoration:none;font-weight:700}.brand-preview{margin:16px auto 0;max-width:420px;padding:12px;border:1px solid #dbe5f2;border-radius:14px;background:#f8fafc;color:#475569;font-size:12px}.hidden{display:none!important}.back{display:block;text-align:center;margin:18px 0 30px;color:#1d4ed8;text-decoration:none;font-weight:700}
</style>
<script src="qr-code-generator.min.js"></script>
</head><body>
<header><h1>Social Media QR Code Maker</h1><p>Create a separate QR code for your social profiles</p></header>
<main class="wrap"><section class="card">
<h2>Choose Social QR Type</h2>
<label for="social-platform">Select a platform</label>
<select id="social-platform">
<option value="instagram">Instagram Profile</option><option value="facebook">Facebook Profile or Page</option><option value="youtube">YouTube Channel or Video</option><option value="tiktok">TikTok Profile</option><option value="telegram">Telegram Username</option><option value="whatsapp">WhatsApp Chat</option><option value="whatsapp-number">WhatsApp Phone Number</option><option value="website">Custom Social Profile URL</option><option value="bundle">All Social Links in One QR</option>
</select>
<div id="social-single-fields">
<label for="social-value">Profile username or full profile link</label><input id="social-value" type="text" placeholder="Enter username or profile URL">
<p class="note" id="social-hint">Example: yourname or https://instagram.com/yourname</p>
</div>
<div id="social-bundle-fields" hidden>
<label for="bundle-name">Your name or business name</label><input id="bundle-name" type="text" placeholder="Name">
<label for="bundle-instagram">Instagram profile link</label><input id="bundle-instagram" type="url" placeholder="https://instagram.com/username">
<label for="bundle-facebook">Facebook profile or page link</label><input id="bundle-facebook" type="url" placeholder="https://facebook.com/username">
<label for="bundle-youtube">YouTube channel link</label><input id="bundle-youtube" type="url" placeholder="https://youtube.com/@channel">
<label for="bundle-whatsapp">WhatsApp number with country code</label><input id="bundle-whatsapp" type="tel" placeholder="91XXXXXXXXXX">
<label for="bundle-other">Other profile or website link (optional)</label><input id="bundle-other" type="url" placeholder="https://...">
</div>
<button id="social-build-button" type="button">Create Social Media QR Code</button>
<p class="note" id="social-status" aria-live="polite">Enter the details for the social profile you want to share.</p>
<div id="qr" aria-live="polite"></div>
<textarea id="content" hidden></textarea><button id="generate-button" type="button" hidden>Generate QR Code</button>
</section><a class="back" href="qr-choice.html">← Back to QR Code Options</a></main>
<script>
function makeQR(){
const value=document.getElementById('content').value.trim();
const box=document.getElementById('qr');
const button=document.getElementById('generate-button');
box.replaceChildren();
if(!value){box.textContent='Please enter a profile link or social information first.';return;}
if(!window.QRCode){box.textContent='The offline QR library did not load. Refresh the page and try again.';return;}
button.disabled=true;
button.textContent='Creating your QR design…';
try{
const platform=document.getElementById('social-platform').value;
const isBundle=platform==='bundle';
const detected=detectPlatform(value,platform);
const theme=isBundle?{name:'Social Links',dark:'#173f7a',light:'#f4f7fc',accent:'#2457a7',glyph:'↗',tag:'All your social links in one place',cta:'SCAN TO CONNECT',file:'Social-Links'}:getBrandTheme(detected);
const holder=document.createElement('div');
holder.style.cssText='position:absolute;left:-10000px;top:0;width:380px;height:380px;overflow:hidden';
document.body.appendChild(holder);
new QRCode(holder,{text:value,width:380,height:380,colorDark:'#111827',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
const sourceCanvas=holder.querySelector('canvas');
if(!sourceCanvas)throw new Error('QR canvas is unavailable');
const qrSize=380;
const moduleCount=33;
const qrInstance=holder.querySelector('canvas').width;
const quietZone=48;
const canvas=document.createElement('canvas');canvas.width=520;canvas.height=700;
const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas is unavailable');
ctx.fillStyle='#f4f6fa';ctx.fillRect(0,0,520,700);
ctx.fillStyle='#ffffff';roundRect(ctx,14,14,492,672,28);ctx.fill();
ctx.strokeStyle='#e5eaf2';ctx.lineWidth=2;roundRect(ctx,14,14,492,672,28);ctx.stroke();
ctx.fillStyle=theme.accent;roundRect(ctx,14,14,492,10,5);ctx.fill();
ctx.fillStyle=theme.light;roundRect(ctx,40,48,72,72,22);ctx.fill();
ctx.fillStyle=theme.accent;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 48px Arial';ctx.fillText(theme.glyph,76,84);
ctx.textAlign='left';ctx.fillStyle='#111827';ctx.font='bold 31px Arial';ctx.fillText(theme.name,132,78);
ctx.fillStyle='#667085';ctx.font='16px Arial';ctx.fillText(theme.tag,132,105);
ctx.fillStyle='#ffffff';roundRect(ctx,40,150,440,440,22);ctx.fill();
ctx.strokeStyle='#e8edf4';ctx.lineWidth=1;roundRect(ctx,40,150,440,440,22);ctx.stroke();
ctx.imageSmoothingEnabled=false;
ctx.drawImage(sourceCanvas,70,180,380,380);
ctx.textAlign='center';ctx.fillStyle=theme.accent;ctx.font='bold 22px Arial';ctx.fillText(theme.cta,260,632);
ctx.fillStyle='#98a2b3';ctx.font='13px Arial';ctx.fillText('Made with InfoJano',260,660);
holder.remove();
const dataUrl=canvas.toDataURL('image/png');
const img=document.createElement('img');img.alt=theme.name+' QR code design';img.src=dataUrl;box.appendChild(img);
const download=document.createElement('a');download.className='qr-download';download.href=dataUrl;download.download='InfoJano-'+theme.file+'-QR.png';download.textContent='Download QR Code (PNG)';box.appendChild(download);
const note=document.createElement('p');note.className='brand-preview';note.textContent='Clean brand-colour frame with a standard black-and-white QR for reliable scanning. The platform mark stays outside the QR pattern.';box.appendChild(note);
}catch(error){box.textContent='Could not create this QR code. Check the link and try again.';}
finally{button.disabled=false;button.textContent='Create Social Media QR Code';}
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function getBrandTheme(platform){
const themes={
facebook:{name:'Facebook',short:'FACEBOOK',dark:'#1877F2',light:'#EAF2FF',accent:'#1877F2',glyph:'f',tag:'Connect with me on Facebook',cta:'SCAN TO OPEN FACEBOOK',file:'Facebook'},
instagram:{name:'Instagram',short:'INSTAGRAM',dark:'#C13584',light:'#FFF0F7',accent:'#E1306C',glyph:'◎',tag:'Follow my Instagram profile',cta:'SCAN TO OPEN INSTAGRAM',file:'Instagram'},
youtube:{name:'YouTube',short:'YOUTUBE',dark:'#E62117',light:'#FFF0F0',accent:'#E62117',glyph:'▶',tag:'Watch and subscribe on YouTube',cta:'SCAN TO OPEN YOUTUBE',file:'YouTube'},
tiktok:{name:'TikTok',short:'TIKTOK',dark:'#111111',light:'#F2FBFB',accent:'#25F4EE',glyph:'♪',tag:'Find me on TikTok',cta:'SCAN TO OPEN TIKTOK',file:'TikTok'},
telegram:{name:'Telegram',short:'TELEGRAM',dark:'#229ED9',light:'#EAF8FF',accent:'#229ED9',glyph:'➤',tag:'Message me on Telegram',cta:'SCAN TO OPEN TELEGRAM',file:'Telegram'},
whatsapp:{name:'WhatsApp',short:'WHATSAPP',dark:'#128C7E',light:'#E9FBF1',accent:'#25D366',glyph:'☎',tag:'Chat with me on WhatsApp',cta:'SCAN TO CHAT ON WHATSAPP',file:'WhatsApp'},
website:{name:'Website',short:'WEBSITE',dark:'#173F7A',light:'#EEF4FF',accent:'#2563EB',glyph:'↗',tag:'Open this website or profile',cta:'SCAN TO OPEN LINK',file:'Website'}
};
return themes[platform]||themes.website;
}
function detectPlatform(raw,selected){
if(selected==='bundle')return 'bundle';
const text=raw.toLowerCase();
if(/https?:\/\/(www\.)?(m\.)?(facebook\.com|fb\.watch)\//.test(text))return 'facebook';
if(/https?:\/\/(www\.)?instagram\.com\//.test(text))return 'instagram';
if(/https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(text))return 'youtube';
if(/https?:\/\/(www\.)?tiktok\.com\//.test(text))return 'tiktok';
if(/https?:\/\/(www\.)?t\.me\//.test(text))return 'telegram';
if(/https?:\/\/(www\.)?wa\.me\//.test(text)||/whatsapp\.com\//.test(text))return 'whatsapp';
return selected;
}
</script>
<script>
(function(){
const platform=document.getElementById('social-platform');if(!platform)return;
const single=document.getElementById('social-single-fields'),bundle=document.getElementById('social-bundle-fields'),value=document.getElementById('social-value'),hint=document.getElementById('social-hint'),status=document.getElementById('social-status');
const examples={instagram:'Example: yourname or https://instagram.com/yourname',facebook:'Example: yourname or https://facebook.com/yourname',youtube:'Example: @channel or https://youtube.com/@channel',tiktok:'Example: yourname or https://tiktok.com/@yourname',telegram:'Example: yourname or https://t.me/yourname',whatsapp:'Enter a phone number with country code, e.g. 919876543210','whatsapp-number':'Enter a phone number with country code, e.g. 919876543210',website:'Paste the complete profile or website URL'};
platform.addEventListener('change',function(){const isBundle=platform.value==='bundle';single.hidden=isBundle;bundle.hidden=!isBundle;hint.textContent=examples[platform.value]||'Enter a username or full link';status.textContent=isBundle?'Add the profile links you want to share.':'Enter the username or link for the selected platform.';document.getElementById('qr').replaceChildren();});
function profileUrl(type,raw){const input=raw.trim();if(!input)return '';if(type==='whatsapp'||type==='whatsapp-number'){const digits=input.replace(/[^0-9]/g,'');if(digits.length<8||digits.length>15)throw new Error('Enter a valid phone number with country code.');return 'https://wa.me/'+digits;}if(/^https?:\/\//i.test(input))return input;const name=input.replace(/^@/,'').replace(/^\//,'');const bases={instagram:'https://www.instagram.com/',facebook:'https://www.facebook.com/',youtube:'https://www.youtube.com/@',tiktok:'https://www.tiktok.com/@',telegram:'https://t.me/'};if(type==='website')throw new Error('Paste the complete URL starting with https://');return (bases[type]||'')+name;}
document.getElementById('social-build-button').addEventListener('click',function(){try{let payload='';if(platform.value==='bundle'){const name=document.getElementById('bundle-name').value.trim();const entries=[['Instagram',document.getElementById('bundle-instagram').value],['Facebook',document.getElementById('bundle-facebook').value],['YouTube',document.getElementById('bundle-youtube').value],['WhatsApp',document.getElementById('bundle-whatsapp').value?profileUrl('whatsapp',document.getElementById('bundle-whatsapp').value):''],['Other',document.getElementById('bundle-other').value]].filter(item=>item[1].trim());if(!entries.length)throw new Error('Enter at least one social profile link.');payload=(name?name+'\n\n':'')+entries.map(item=>item[0]+': '+item[1]).join('\n');}else{const raw=value.value.trim();if(!raw)throw new Error('Enter a username, phone number or profile link.');payload=profileUrl(platform.value,raw);}document.getElementById('content').value=payload;makeQR();status.textContent='Your Social Media QR Code is ready. Scan it with a phone to check the link.';}catch(error){status.textContent=error.message||'Please check the information and try again.';}});
})();
</script>
</body></html>
