<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Social Media QR Code Maker | InfoJano</title>
<meta name="description" content="Create a QR code for Instagram, Facebook, YouTube, TikTok, Telegram, WhatsApp or multiple social profile links.">
<link rel="canonical" href="https://barsulkhan.github.io/InfoJano/social-qr-maker.html">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f6ff;color:#172033;line-height:1.6}header{background:#10458e;color:#fff;text-align:center;padding:22px 15px}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:#dbeafe;font-size:14px}.wrap{max-width:680px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #dce5f2;border-radius:18px;padding:20px;box-shadow:0 5px 20px #1720330c}h2{font-size:21px;margin:0 0 12px}label{display:block;font-weight:700;font-size:14px;margin:13px 0 6px}input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:16px}button{width:100%;border:0;border-radius:11px;background:#173f7a;color:#fff;font-weight:750;font-size:16px;padding:14px;margin-top:16px;cursor:pointer}button:disabled{opacity:.6}.note{font-size:12px;color:#64748b;margin:7px 0}.status{min-height:22px;color:#334155;font-size:13px;margin-top:10px}#qr{text-align:center;margin-top:20px}#qr img{max-width:100%;height:auto;border:1px solid #e2e8f0;border-radius:10px;padding:8px;background:#fff}.qr-download{display:inline-block;margin-top:12px;padding:11px 16px;background:#0b7a55;color:#fff;border-radius:10px;text-decoration:none;font-weight:700}.hidden{display:none!important}.back{display:block;text-align:center;margin:18px 0 30px;color:#1d4ed8;text-decoration:none;font-weight:700}
</style>
<script src="qr-code-generator.min.js"></script>
</head><body>
<header><h1>Social Media QR Code Maker</h1><p>Create a separate QR code for your social profiles</p></header>
<main class="wrap"><section class="card">
<h2>Choose Social QR Type</h2>
<label for="social-platform">Select a platform</label>
<select id="social-platform">
<option value="instagram">Instagram Profile</option><option value="facebook">Facebook Profile or Page</option><option value="youtube">YouTube Channel or Video</option><option value="tiktok">TikTok Profile</option><option value="telegram">Telegram Username</option><option value="whatsapp">WhatsApp Chat</option><option value="whatsapp-number">WhatsApp Phone Number</option><option value="website">Custom Social Profile URL</option><option value="bundle">All Social Links in One QR</option>
</select>
<div id="social-single-fields">
<label for="social-value">Profile username or full profile link</label><input id="social-value" type="text" placeholder="Enter username or profile URL">
<p class="note" id="social-hint">Example: yourname or https://instagram.com/yourname</p>
</div>
<div id="social-bundle-fields" hidden>
<label for="bundle-name">Your name or business name</label><input id="bundle-name" type="text" placeholder="Name">
<label for="bundle-instagram">Instagram profile link</label><input id="bundle-instagram" type="url" placeholder="https://instagram.com/username">
<label for="bundle-facebook">Facebook profile or page link</label><input id="bundle-facebook" type="url" placeholder="https://facebook.com/username">
<label for="bundle-youtube">YouTube channel link</label><input id="bundle-youtube" type="url" placeholder="https://youtube.com/@channel">
<label for="bundle-whatsapp">WhatsApp number with country code</label><input id="bundle-whatsapp" type="tel" placeholder="91XXXXXXXXXX">
<label for="bundle-other">Other profile or website link (optional)</label><input id="bundle-other" type="url" placeholder="https://...">
</div>
<button id="social-build-button" type="button">Create Social Media QR Code</button>
<p class="note" id="social-status" aria-live="polite">Enter the details for the social profile you want to share.</p>
<div id="qr" aria-live="polite"></div>
<textarea id="content" hidden></textarea><button id="generate-button" type="button" hidden>Generate QR Code</button>
</section><a class="back" href="qr-choice.html">← Back to QR Code Options</a></main>
<script>
function makeQR(){
const value=document.getElementById('content').value.trim();
const box=document.getElementById('qr');
const button=document.getElementById('generate-button');
box.replaceChildren();
if(!value){box.textContent='Please enter text or a website URL first.';return;}
if(!window.QRCode){box.textContent='The offline QR library did not load. Refresh the page and try again.';return;}
button.disabled=true;
button.textContent='Generating QR Code… Please wait';
try{
const holder=document.createElement('div');
holder.style.cssText='position:absolute;left:-10000px;top:0;width:400px;height:400px;overflow:hidden';
document.body.appendChild(holder);
const qrInstance=new QRCode(holder,{text:value,width:400,height:400,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
const sourceCanvas=holder.querySelector('canvas');
const generatedImage=holder.querySelector('img');
if(!sourceCanvas)throw new Error('QR canvas is unavailable');
const moduleCount=qrInstance._oQRCode && qrInstance._oQRCode.getModuleCount ? qrInstance._oQRCode.getModuleCount() : 33;
const quietZone=Math.ceil((400/moduleCount)*4);
const outputCanvas=document.createElement('canvas');
outputCanvas.width=400+(quietZone*2);
outputCanvas.height=400+(quietZone*2);
const context=outputCanvas.getContext('2d');
if(!context)throw new Error('QR canvas context is unavailable');
context.fillStyle='#ffffff';
context.fillRect(0,0,outputCanvas.width,outputCanvas.height);
context.imageSmoothingEnabled=false;
context.drawImage(sourceCanvas,quietZone,quietZone,400,400);
const dataUrl=outputCanvas.toDataURL('image/png');
holder.remove();
if(!dataUrl)throw new Error('QR image could not be created');
const img=document.createElement('img');
img.alt='Generated QR code';
img.width=260;img.style.height='auto';
img.src=dataUrl;
box.appendChild(img);
const download=document.createElement('a');
download.className='qr-download';
download.href=dataUrl;
download.download='InfoJano-QR-'+new Date().toISOString().replace(/[-:]/g,'').replace(/\\.\\d{3}Z$/,'Z')+'.png';
download.textContent='Download QR Code (PNG)';
box.appendChild(download);
const status=document.createElement('p');
status.className='qr-status';
status.textContent='QR code created locally with a clear white border for easier scanning.';
box.appendChild(status);
}catch(error){
box.textContent='Could not create this QR code. Try a shorter text or website link.';
}finally{
button.disabled=false;
button.textContent='Generate QR Code';
}
}
</script>
<script>
(function(){
const platform=document.getElementById('social-platform');if(!platform)return;
const single=document.getElementById('social-single-fields'),bundle=document.getElementById('social-bundle-fields'),value=document.getElementById('social-value'),hint=document.getElementById('social-hint'),status=document.getElementById('social-status');
const examples={instagram:'Example: yourname or https://instagram.com/yourname',facebook:'Example: yourname or https://facebook.com/yourname',youtube:'Example: @channel or https://youtube.com/@channel',tiktok:'Example: yourname or https://tiktok.com/@yourname',telegram:'Example: yourname or https://t.me/yourname',whatsapp:'Enter a phone number with country code, e.g. 919876543210','whatsapp-number':'Enter a phone number with country code, e.g. 919876543210',website:'Paste the complete profile or website URL'};
platform.addEventListener('change',function(){const isBundle=platform.value==='bundle';single.hidden=isBundle;bundle.hidden=!isBundle;hint.textContent=examples[platform.value]||'Enter a username or full link';status.textContent=isBundle?'Add the profile links you want to share.':'Enter the username or link for the selected platform.';document.getElementById('qr').replaceChildren();});
function profileUrl(type,raw){const input=raw.trim();if(!input)return '';if(type==='whatsapp'||type==='whatsapp-number'){const digits=input.replace(/[^0-9]/g,'');if(digits.length<8||digits.length>15)throw new Error('Enter a valid phone number with country code.');return 'https://wa.me/'+digits;}if(/^https?:\/\//i.test(input))return input;const name=input.replace(/^@/,'').replace(/^\//,'');const bases={instagram:'https://www.instagram.com/',facebook:'https://www.facebook.com/',youtube:'https://www.youtube.com/@',tiktok:'https://www.tiktok.com/@',telegram:'https://t.me/'};if(type==='website')throw new Error('Paste the complete URL starting with https://');return (bases[type]||'')+name;}
document.getElementById('social-build-button').addEventListener('click',function(){try{let payload='';if(platform.value==='bundle'){const name=document.getElementById('bundle-name').value.trim();const entries=[['Instagram',document.getElementById('bundle-instagram').value],['Facebook',document.getElementById('bundle-facebook').value],['YouTube',document.getElementById('bundle-youtube').value],['WhatsApp',document.getElementById('bundle-whatsapp').value?profileUrl('whatsapp',document.getElementById('bundle-whatsapp').value):''],['Other',document.getElementById('bundle-other').value]].filter(item=>item[1].trim());if(!entries.length)throw new Error('Enter at least one social profile link.');payload=(name?name+'\n\n':'')+entries.map(item=>item[0]+': '+item[1]).join('\n');}else{const raw=value.value.trim();if(!raw)throw new Error('Enter a username, phone number or profile link.');payload=profileUrl(platform.value,raw);}document.getElementById('content').value=payload;makeQR();status.textContent='Your Social Media QR Code is ready. Scan it with a phone to check the link.';}catch(error){status.textContent=error.message||'Please check the information and try again.';}});
})();
</script>
</body></html>
