<text x="400" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="86" font-weight="800" fill="#163e6b">1250<tspan fill="#087de5">.</tspan><tspan fill="#0d9baf">75</tspan></text>
<rect x="170" y="315" width="205" height="125" rx="20" fill="#eaf5ff"/><rect x="425" y="315" width="205" height="125" rx="20" fill="#e8fbff"/>
