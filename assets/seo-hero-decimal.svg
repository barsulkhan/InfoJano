<text x="527" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#428197">DECIMAL PART</text><text x="527" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#087d9d">75</text></g>
