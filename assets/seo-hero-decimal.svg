<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="t d">
<title id="t">Decimal number illustration</title><desc id="d">A calculator-style card showing a decimal value and separated whole and fractional parts.</desc>
