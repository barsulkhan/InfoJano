 <rect x="250" y="139" width="245" height="15" rx="8" fill="#d7e8f7"/><rect x="250" y="172" width="210" height="15" rx="8" fill="#d7e8f7"/><rect x="250" y="205" width="170" height="15" rx="8" fill="#d7e8f7"/>
 <path d="M390 242h110" stroke="#142b4c" stroke-width="7" stroke-dasharray="5 5"/>
