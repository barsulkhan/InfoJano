<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1faff"/><stop offset="1" stop-color="#cce8ff"/></linearGradient>
 <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#087de5"/><stop offset="1" stop-color="#1748ce"/></linearGradient>
 <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff0a8"/><stop offset=".55" stop-color="#f4bd36"/><stop offset="1" stop-color="#bd790b"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#326b9b" flood-opacity=".2"/></filter>
</defs>
<rect width="800" height="650" rx="42" fill="url(#bg)"/>
<circle cx="650" cy="130" r="120" fill="#fff" opacity=".36"/>
